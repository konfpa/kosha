{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {# Back and forward refetch the page, since a cached snapshot holds stale data and DOM Alpine has already initialised. #}
    <meta name="htmx-config" content='{"historyCacheSize": 0}'>
    <title>{% block title %}kosha{% endblock %}</title>
    <script>
      // Runs before first paint so a dark page never flashes light. The
      // "theme" key is shared with Django admin, where "auto" means follow
      // the system, as a missing value does here.
      (() => {
        const system = matchMedia("(prefers-color-scheme: dark)");
        const stored = () => { try { return localStorage.getItem("theme"); } catch { return null; } };
        const apply = () => {
          const theme = stored();
          document.documentElement.classList.toggle("dark", theme === "dark" || (theme !== "light" && system.matches));
        };
        window.toggleTheme = () => {
          const dark = document.documentElement.classList.toggle("dark");
          try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch {}
        };
        apply();
        system.addEventListener("change", apply);
      })();
    </script>
    {% include "includes/icons.html" %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script>
      // Back and forward each fetch their page, and htmx lets them all land,
      // so a quick second press could see the first page arrive last.
      (() => {
        let restoring;
        document.addEventListener("htmx:historyCacheMiss", (event) => {
          restoring?.abort();
          restoring = event.detail.xhr;
        });
      })();
    </script>
    <script src="{% static 'vendor/htmx-2.0.11.min.js' %}" defer></script>
    <script src="{% static 'vendor/alpine-3.17.4.min.js' %}" defer></script>
  </head>
  <body class="min-h-screen bg-white text-gray-900 antialiased dark:bg-stone-950 dark:text-stone-100" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% block content %}{% endblock %}
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("{% url 'service_worker' %}");</script>
  </body>
</html>
