{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}kosha{% endblock %}</title>
    {% include "includes/icons.html" %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'vendor/htmx-2.0.11.min.js' %}" defer></script>
    <script src="{% static 'vendor/alpine-3.17.4.min.js' %}" defer></script>
  </head>
  <body class="min-h-screen bg-white text-gray-900 antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% block content %}{% endblock %}
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("{% url 'service_worker' %}");</script>
  </body>
</html>
