{% extends "registration/layout.html" %}

{% block title %}Password changed · kosha{% endblock %}

{% block page %}
  <span class="flex size-12 items-center justify-center rounded-full bg-brand text-white">
    <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
  </span>
  <h1 class="mt-5 text-xl font-semibold tracking-tight text-stone-900">Password changed</h1>
  <p class="mt-1 max-w-xs text-center text-sm text-stone-500">You've been signed out on other devices. Sign in with your new password to continue.</p>

  <a href="{% url 'login' %}" class="btn-primary mt-8 max-w-sm">Sign in</a>
{% endblock %}
