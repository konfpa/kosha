{% load icons %}
<div class="relative mt-1.5">
  <input id="{{ field.id_for_label }}" name="{{ field.html_name }}" type="password" autocomplete="{{ autocomplete }}" required
         {% if field.errors %}aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% endif %}
         class="field pr-11">
  <button type="button" data-reveal aria-label="Show password" aria-pressed="false"
          class="absolute inset-y-0 right-0 flex w-11 items-center justify-center rounded-r-lg text-stone-400 hover:text-stone-700 focus-visible:text-brand focus-visible:outline-none">
    {% icon "eye" data_eye="" class="size-[18px]" stroke_width=1.75 %}
    {% icon "eye-off" data_eye_off="" class="size-[18px]" stroke_width=1.75 hidden="" %}
  </button>
</div>
{% for error in field.errors %}
  <p id="{{ field.id_for_label }}-error" class="mt-1.5 text-xs text-red-600">{{ error }}</p>
{% endfor %}
